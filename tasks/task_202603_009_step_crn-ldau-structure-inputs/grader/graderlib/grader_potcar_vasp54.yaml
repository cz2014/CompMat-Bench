# LDA (Ceperley-Alder) PAW library potpaw_LDA.54. Kept under a separate
# top-level key rather than merged into `species` above: element symbols
# collide between the PBE and LDA libraries (e.g. N appears in both, with
# different TITEL dates and, in general, different ENMAX), so one flat
# element-keyed map cannot hold both. Same schema and same two consumers as
# `species`.
