# VASP 5.4 PAW PBE pseudopotential catalog: identity and public metadata only.
# No POTCAR content is stored or redistributed (licensing). These are the same
# fields our potcar_spec.txt provenance records, plus cutoff metadata needed by
# graders and by sealed agents.
#
# Two consumers:
#   (1) the source for each task's agent-facing potcar_catalog.yaml, which is a
#       per-task SUBSET listing only the species that task uses (the agent must
#       not see other papers' species or any grading-floor language; see
#       docs/design/review_kit_runbook.md). This master is NOT staged to agents.
#   (2) read by tasks/grader_vasp_inputs.py for the ENCUT rubric rule
#       (ENCUT >= 1.0 * max ENMAX over the species present; the grading floor is
#       the pseudopotential's own ENMAX, e.g. 400 eV for B+N. Decided in
#       docs/decision-records/2026-06-17_vasp_rubric_encut.md).
#
# Extend with new species as new papers need them. Values are read from the
# POTCAR headers of the full VASP 5.4 PBE library (the complete table is
# tasks/grader_potcar_vasp54_enmax_all.yaml, harvested from our the HPC cluster install);
# our as-run OUTCARs cross-check them (OUTCAR echoes can differ in the last
# rounding digit, e.g. B 318.614 vs the header's 318.606 -- the header value
# is canonical and is the lower, safer floor).

schema:
  titel: "POTCAR TITEL line (the identity our potcar_spec.txt records)"
  enmax_eV: "POTCAR ENMAX: minimum sensible plane-wave cutoff"
  enmin_eV: "POTCAR ENMIN"
  valence: "number of valence electrons (ZVAL)"
  notes: "rubric_floor_encut = 1.0 * ENMAX (gen_input grading floor = the pseudopotential's own ENMAX); convergence target ~1.3 * ENMAX; cell relaxation uses 1.3 * ENMAX (Pulay)"

